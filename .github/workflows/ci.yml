name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# The backend tests share one Neon test branch, so run one workflow at a time.
concurrency:
  group: ci-test-database
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Neon test branch (direct connection), stored as a repository secret.
      DATABASE_URL: ${{ secrets.TEST_DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Frontend tests
        run: npx vitest run --config vitest.client.config.ts

      - name: Backend tests
        run: npx vitest run

      - name: Build
        run: npm run build
