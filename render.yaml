services:
  - type: web
    name: lawn-care-assistant
    runtime: node
    plan: free
    branch: main
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    # Deploy only after the GitHub Actions checks on the commit pass.
    autoDeployTrigger: checksPass
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: SESSION_SECRET
        generateValue: true
      # Set these in the Render dashboard when the Blueprint is first created.
      - key: DATABASE_URL
        sync: false
      - key: APP_PASSWORD
        sync: false
      - key: OWNER_USER_ID
        sync: false
